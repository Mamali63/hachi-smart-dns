server:
    interface: 127.0.0.1
    interface: 203.0.113.10  # your server public IP
    # interface: <your private/tailnet IP, if any>
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    prefetch: yes
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    access-control: 127.0.0.0/8 allow
    # access-control: <your private network, if any> allow
    # WARNING: never allow 0.0.0.0/0 (open resolver) in production.
    # Allow only localhost and your whitelisted customer IPs.
    # access-control: <customer-ip>/32 allow
    ratelimit: 200
    ip-ratelimit: 200
    forward-zone:
        name: "."
        forward-addr: 1.1.1.1
        forward-addr: 1.0.0.1
        forward-addr: 8.8.8.8
